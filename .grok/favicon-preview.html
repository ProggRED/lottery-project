<!doctype html><html><body style="margin:0;background:#111">
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c32" width="32" height="32"></canvas>
<script>
const svg = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\">\n  <rect width=\"32\" height=\"32\" rx=\"8\" fill=\"#080b0f\"/>\n  <circle cx=\"16\" cy=\"16\" r=\"10.5\" fill=\"#b8ff62\"/>\n  <path d=\"M12.4 10.2h3.2v7.3h5.4v3.3H12.4z\" fill=\"#080b0f\"/>\n</svg>\n";
const blob = new Blob([svg], {type:'image/svg+xml'});
const url = URL.createObjectURL(blob);
const img = new Image();
img.onload = () => {
  for (const id of ['c16','c32']) {
    const c = document.getElementById(id);
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, c.width, c.height);
  }
  document.body.dataset.ready = '1';
};
img.src = url;
</script></body></html>
